# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DPM_VERSION: 1.0.10
  SDK_VERSION: 3.4.11
  DPM_REGISTRY_PATH: https://europe-docker.pkg.dev/v2/da-images/public/components/dpm

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Put dpm on PATH
        run: echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"

      - name: Restore dpm cache
        uses: actions/cache@v4
        with:
          path: ~/.dpm
          key: dpm-${{ runner.os }}-${{ env.DPM_VERSION }}-sdk-${{ env.SDK_VERSION }}

      - name: Install dpm
        run: |
          set -euo pipefail
          if [ -x "$HOME/.dpm/bin/dpm" ]; then
            echo "dpm already present"
            exit 0
          fi
          digest="$(curl -fsSL \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "$DPM_REGISTRY_PATH/manifests/$DPM_VERSION.linux_amd64" \
            | jq -r '.layers[0].digest')"
          mkdir -p "$HOME/.dpm/bin"
          curl -fsSL "$DPM_REGISTRY_PATH/blobs/$digest" -o "$HOME/.dpm/bin/dpm"
          chmod +x "$HOME/.dpm/bin/dpm"

      - name: Install Daml SDK
        run: dpm install "$SDK_VERSION"

      - name: Report versions
        run: |
          dpm --version
          java -version

      - name: Build all packages
        run: dpm build --all

      - name: Run Daml Script tests
        run: |
          set -uo pipefail
          mapfile -t packages < <(
            sed -nE 's|^[[:space:]]*-[[:space:]]+\./(.*/test)[[:space:]]*$|\1|p' multi-package.yaml
          )
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "no test packages found in multi-package.yaml" >&2
            exit 1
          fi
          failed=()
          for package in "${packages[@]}"; do
            echo "::group::dpm test $package"
            if dpm test --package-root "$package"; then
              echo "::endgroup::"
              echo "$package ok"
            else
              echo "::endgroup::"
              echo "::error title=Daml Script tests failed::$package"
              failed+=("$package")
            fi
          done
          {
            echo "### Daml Script tests"
            echo
            for package in "${packages[@]}"; do
              status="ok"
              for bad in "${failed[@]-}"; do
                [ "$bad" = "$package" ] && status="FAILED"
              done
              echo "- \`$package\` — $status"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${#failed[@]}" -eq 0 ]
