# Tier 2 (Governance, optional) — reusable helpers for implementing the
# governance interfaces. Four modules:
#   Cap.Governance.Tallies         Reference decision rules (quorate majority,
#                                  weighted quorate, turnout threshold) an
#                                  implementation wires as its `tally`.
#   Cap.Governance.TargetUtil      Everything for acting on a committed target:
#                                  drift detection (targetDrifted), the named
#                                  drift policies (driftAborts/noDrift),
#                                  and fetchTargetFromContext (authenticated
#                                  context read).
#   Cap.Governance.ActionUtil      Data actions as per-target specs
#                                  (TargetEntry/ActionSpec), TypedAction (the
#                                  native-or-extension union), the NativeAction
#                                  class, and anyActionBuildRefs (commit either
#                                  kind's targets).
# Domain-agnostic helpers live in cap-core-util (Cap.Core.Patchable,
# Cap.Core.Policies); the HasCheckedFetch instances live with their views
# (GovernorV1, TargetV1, and cap-core's OutcomeV1), and the machinery in
# Cap.Core.ChecksV1.
# Sits BELOW nothing it implements: it depends on the governance interface
# packages (to see their views/methods) and is imported only by tier-3 impls,
# so the interfaces never reference it (no cycle).
sdk-version: 3.4.11
name: cap-governance-util
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../lib/splice-api-token-metadata-v1-1.0.0.dar
- ../../lib/splice-util-0.1.7.dar
- ../../cap-core/util/checked-fetch/.daml/dist/cap-core-checked-fetch-v1-0.1.0.dar
- ../../cap-core/Interfaces/submittable/.daml/dist/cap-core-submittable-v1-0.1.0.dar
- ../../cap-core/Interfaces/mechanism/.daml/dist/cap-core-mechanism-v1-0.1.0.dar
- ../../cap-core/internal/checks/.daml/dist/cap-core-checks-v1-0.1.0.dar
- ../../cap-core/Interfaces/outcome/.daml/dist/cap-core-outcome-v1-0.1.0.dar
- ../Interfaces/target/.daml/dist/cap-governance-target-v1-0.1.0.dar
- ../Interfaces/outcome/.daml/dist/cap-governance-outcome-v1-0.1.0.dar
- ../Interfaces/action/.daml/dist/cap-governance-action-v1-0.1.0.dar
- ../Interfaces/governor/.daml/dist/cap-governance-governor-v1-0.1.0.dar
build-options:
  - --target=2.1
