# Tier 2 (Governance, optional) — reusable helpers for implementing the
# governance interfaces. One module:
#   Cap.Governance.Policies  named timing policies for the Proposal hooks
#                            (resolutionAllowed / withdrawAllowed) — windowed
#                            and confirmation profiles
# Domain-agnostic helpers live in cap-core-util (Cap.Core.Patchable,
# Cap.Core.TargetPolicies); the HasCheckedFetch instances live with their views
# (ProposalV1, and cap-core's OutcomeV1), and the machinery in
# Cap.Core.ChecksV1.
# Sits BELOW nothing it implements: it depends on the governance interface
# packages (to see their views/methods) and is imported only by tier-3 impls,
# so the interfaces never reference it (no cycle).
sdk-version: 3.4.11
name: cap-governance-util
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../cap-core/Interfaces/metadata/.daml/dist/cap-core-metadata-v1-0.1.0.dar
- ../../cap-core/Interfaces/submittable/.daml/dist/cap-core-submittable-v1-0.1.0.dar
- ../../cap-core/Interfaces/resolvable/.daml/dist/cap-core-resolvable-v1-0.1.0.dar
- ../../cap-core/Interfaces/checks/.daml/dist/cap-core-checks-v1-0.1.0.dar
- ../Interfaces/proposal/.daml/dist/cap-governance-proposal-v1-0.1.0.dar
build-options:
  - --target=2.1
