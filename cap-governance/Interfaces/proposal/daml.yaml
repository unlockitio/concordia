# Tier 2 (Governance) — `Proposal` and `Ballot`. They share one package (and
# one module) deliberately: their views reference each other's contract ids,
# Daml forbids circular package/module deps, and splitting them would force an
# untyped (forgeable) binding.
sdk-version: 3.4.11
name: cap-governance-proposal-v1
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../../cap-core/Interfaces/metadata/.daml/dist/cap-core-metadata-v1-0.1.0.dar
- ../../../cap-core/Interfaces/submittable/.daml/dist/cap-core-submittable-v1-0.1.0.dar
- ../../../cap-core/Interfaces/resolvable/.daml/dist/cap-core-resolvable-v1-0.1.0.dar
- ../../../cap-core/Interfaces/checks/.daml/dist/cap-core-checks-v1-0.1.0.dar
- ../../../cap-core/Interfaces/target/.daml/dist/cap-core-target-v1-0.1.0.dar
- ../../../cap-core/Interfaces/outcome/.daml/dist/cap-core-outcome-v1-0.1.0.dar
build-options:
  - --target=2.1
