# Tier 2 (Governance) — the `Ballot` interface, split out from `Governor`.
# `Ballot` names the mechanism it is cast against only as its `Mechanism`
# face, so it does not reference `Governor`: the dependency runs one way,
# `Governor -> Ballot`. Its own binding is anchored on the (untyped)
# `Submittable` face, which is the face admission proves — the typed field is a
# convenience mirror, not the security anchor.
sdk-version: 3.4.11
name: cap-governance-ballot-v1
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../../lib/splice-api-token-metadata-v1-1.0.0.dar
- ../../../lib/splice-util-0.1.7.dar
- ../../../cap-core/util/time/.daml/dist/cap-core-time-v1-0.1.0.dar
- ../../../cap-core/util/checked-fetch/.daml/dist/cap-core-checked-fetch-v1-0.1.0.dar
- ../../../cap-core/Interfaces/submittable/.daml/dist/cap-core-submittable-v1-0.1.0.dar
- ../../../cap-core/Interfaces/mechanism/.daml/dist/cap-core-mechanism-v1-0.1.0.dar
build-options:
  - --target=2.1
