# Tier 2 (Governance) — the `VotingRight` interface: an authority-signed,
# single-use entitlement to vote on one proposal. Consuming `Cast` IS the
# no-double-vote guarantee. How rights get minted (roster, delegation, locked
# token holdings) is implementation territory.
sdk-version: 3.4.11
name: cap-governance-voting-right
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../cap-governance-types-v1/.daml/dist/cap-governance-types-0.1.0.dar
- ../cap-governance-executable-v1/.daml/dist/cap-governance-executable-0.1.0.dar
- ../cap-governance-proposal-v1/.daml/dist/cap-governance-proposal-0.1.0.dar
build-options:
  - --target=2.1
