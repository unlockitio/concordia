# Golden-vector tests for the Baby-DSO oracle. Kept in a separate package from
# the templates (baby-dso) so the template package carries no daml-script
# dependency. Depends on the baby-dso DAR for the templates + types under test.
sdk-version: 3.4.11
name: baby-dso-test
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
- daml-script
data-dependencies:
- ../BabyDso/.daml/dist/baby-dso-0.1.0.dar
build-options:
  - --target=2.1
