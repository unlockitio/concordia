# Tier 2 (Governance) — `Proposal` and `Ballot`. They share one package (and
# one module) deliberately: their views reference each other's contract ids,
# Daml forbids circular package/module deps, and splitting them would force an
# untyped (forgeable) binding.
sdk-version: 3.4.11
name: cap-governance-proposal
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../cap-governance-types-v1/.daml/dist/cap-governance-types-0.1.0.dar
- ../cap-governance-executable-v1/.daml/dist/cap-governance-executable-0.1.0.dar
build-options:
  - --target=2.1
