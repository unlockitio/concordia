# Tier 2 (Auctions) — the `Bid` interface: a live bid, bound to one auction,
# owned by one bidder, consumable by that auction's resolution. Carries no
# bid-value field anywhere (view, method result, or choice result), which is
# what makes sealed formats implementable: there is nothing to leak.
sdk-version: 3.4.11
name: cap-auctions-bid
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../cap-auctions-types-v1/.daml/dist/cap-auctions-types-0.1.0.dar
build-options:
  - --target=2.1
