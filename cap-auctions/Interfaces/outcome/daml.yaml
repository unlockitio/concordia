# Tier 2 (Auctions) — the `AuctionOutcome` interface: one settlement
# obligation produced by a resolution. Awards to one party; settled or failed
# exactly once (consuming choices). Settlement composes with the Token
# Standard through `ExtraArgs.context` (allocation cids), never through
# imports.
sdk-version: 3.4.11
name: cap-auctions-outcome-v1
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../../lib/splice-api-token-metadata-v1-1.0.0.dar
- ../types/.daml/dist/cap-auctions-types-v1-0.1.0.dar
build-options:
  - --target=2.1
