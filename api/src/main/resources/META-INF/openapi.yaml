  "components": {
    "schemas": {
      "Page": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "oneOf": [
                {
                  "$ref": "#/components/schemas/ACTIONContract"
                },
                {
                  "$ref": "#/components/schemas/EXECUTABLEContract"
                },
                {
                  "$ref": "#/components/schemas/RESOLVERContract"
                },
                {
                  "$ref": "#/components/schemas/VOTE_RECORDContract"
                },
                {
                  "$ref": "#/components/schemas/VOTING_RIGHTSContract"
                },
                {
                  "$ref": "#/components/schemas/VOTE_TOPICContract"
                },
                {
                  "$ref": "#/components/schemas/BID_PROPOSALContract"
                },
                {
                  "$ref": "#/components/schemas/BIDContract"
                },
                {
                  "$ref": "#/components/schemas/SINGLE_LOT_QUOTESContract"
                },
                {
                  "$ref": "#/components/schemas/SETTLEMENTContract"
                },
                {
                  "$ref": "#/components/schemas/TRADE_PROPOSALContract"
                }
              ]
            }
          },
          "snapshot": {
            "type": "string",
            "pattern": "^[0-9]+$"
          },
          "nextCursor": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "ActionLink": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "available",
              "no_generic_reference",
              "target_unavailable"
            ]
          },
          "target": {
            "type": "object",
            "nullable": true,
            "required": ["contractId", "view"],
            "properties": {
              "contractId": { "type": "string" },
              "view": { "$ref": "#/components/schemas/ACTIONView" }
            }
          },
          "snapshot": {
            "type": "string"
          }
        }
      },
      "ACTIONView": {
        "type": "object",
        "properties": {
          "authorizers": {},
          "snapshots": {},
          "meta": {}
        },
        "required": [
          "authorizers",
          "snapshots",
          "meta"
        ]
      },
      "ACTIONContract": {
        "type": "object",
        "required": [
          "contractId",
          "view"
        ],
        "properties": {
          "contractId": {
            "type": "string"
          },
          "view": {
            "$ref": "#/components/schemas/ACTIONView"
          }
        }
      },
      "EXECUTABLEView": {
        "type": "object",
        "properties": {
          "executionCore": {},
          "snapshots": {},
          "outcome": {}
        },
        "required": [
          "executionCore",
          "snapshots",
          "outcome"
        ]
      },
      "EXECUTABLEContract": {
        "type": "object",
        "required": [
          "contractId",
          "view"
        ],
        "properties": {
          "contractId": {
            "type": "string"
          },
          "view": {
            "$ref": "#/components/schemas/EXECUTABLEView"
          }
        }
      },
      "RESOLVERView": {
        "type": "object",
        "properties": {
          "keyId": {
            "type": "string",
            "nullable": false
          },
          "mechanisms": {},
          "meta": {}
        },
        "required": [
          "keyId",
          "mechanisms",
          "meta"
        ]
      },
      "RESOLVERContract": {
        "type": "object",
