# Reference example for the Governance standard: concrete end-user templates
# that `implements` the cap-governance + cap-core interfaces. This is *a*
# reference implementation for proving and testing the standard — not *the*
# canonical one. Adopters write their own end-user templates.
sdk-version: 3.4.11
name: cap-governance-example
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
# Implements the governance interfaces; depend only on the ones actually
# implemented, plus the core primitives they require.
data-dependencies:
- ../../cap-core/cap-core-metadata-v1/.daml/dist/cap-core-metadata-0.1.0.dar
- ../../cap-core/cap-core-submittable-v1/.daml/dist/cap-core-submittable-0.1.0.dar
- ../../cap-core/cap-core-executable-outcome-v1/.daml/dist/cap-core-executable-outcome-0.1.0.dar
- ../../cap-core/cap-core-resolvable-v1/.daml/dist/cap-core-resolvable-0.1.0.dar
- ../../cap-core/cap-core-submission-factory-v1/.daml/dist/cap-core-submission-factory-0.1.0.dar
- ../../cap-governance/cap-governance-ballot-v1/.daml/dist/cap-governance-ballot-0.1.0.dar
- ../../cap-governance/cap-governance-outcome-v1/.daml/dist/cap-governance-outcome-0.1.0.dar
- ../../cap-governance/cap-governance-proposal-v1/.daml/dist/cap-governance-proposal-0.1.0.dar
- ../../cap-governance/cap-governance-ballot-factory-v1/.daml/dist/cap-governance-ballot-factory-0.1.0.dar
build-options:
  - --target=2.1
