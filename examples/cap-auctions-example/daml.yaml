# Reference example for the Auctions standard: concrete end-user templates that
# `implements` the cap-auctions + cap-core interfaces and compose the winning
# outcome with a Token Standard allocation. This is *a* reference
# implementation for proving and testing the standard — not *the* canonical one.
sdk-version: 3.4.11
name: cap-auctions-example
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
# Implements the auctions interfaces; depend only on the ones actually
# implemented, plus the core primitives they require. The token-standard DARs
# are needed only by the settlement in Cap.Auctions.Outcome.
data-dependencies:
- ../../cap-core/cap-core-metadata-v1/.daml/dist/cap-core-metadata-0.1.0.dar
- ../../cap-core/cap-core-submittable-v1/.daml/dist/cap-core-submittable-0.1.0.dar
- ../../cap-core/cap-core-executable-outcome-v1/.daml/dist/cap-core-executable-outcome-0.1.0.dar
- ../../cap-core/cap-core-resolvable-v1/.daml/dist/cap-core-resolvable-0.1.0.dar
- ../../cap-core/cap-core-submission-factory-v1/.daml/dist/cap-core-submission-factory-0.1.0.dar
- ../../cap-auctions/cap-auctions-bid-v1/.daml/dist/cap-auctions-bid-0.1.0.dar
- ../../cap-auctions/cap-auctions-outcome-v1/.daml/dist/cap-auctions-outcome-0.1.0.dar
- ../../cap-auctions/cap-auctions-auction-v1/.daml/dist/cap-auctions-auction-0.1.0.dar
- ../../cap-auctions/cap-auctions-bid-factory-v1/.daml/dist/cap-auctions-bid-factory-0.1.0.dar
# - lib/splice-api-token-allocation-v1.dar
# - lib/splice-api-token-transfer-instruction-v1.dar
build-options:
  - --target=2.1
