# The extension demo (DEMOS.md, demo 5): a governance action added AFTER
# deployment, in its own package. Its only link to the base cap-version
# package is a data-dependency on its targets — the base DAR is untouched.
sdk-version: 3.4.11
name: cap-version-extension
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../../../lib/splice-api-token-metadata-v1-1.0.0.dar
- ../../../../lib/splice-util-0.1.7.dar
- ../../../../cap-core/util/time/.daml/dist/cap-core-time-v1-0.1.0.dar
- ../../../../cap-core/util/checked-fetch/.daml/dist/cap-core-checked-fetch-v1-0.1.0.dar
- ../../../../cap-core/Interfaces/mechanism/.daml/dist/cap-core-mechanism-v1-0.1.0.dar
- ../../../../cap-core/Interfaces/outcome/.daml/dist/cap-core-outcome-v1-0.1.0.dar
- ../../../../cap-core/util/patchable/.daml/dist/cap-core-patchable-0.1.0.dar
- ../../../../cap-governance/Interfaces/target/.daml/dist/cap-governance-target-v1-0.1.0.dar
- ../../../../cap-governance/Interfaces/outcome/.daml/dist/cap-governance-outcome-v1-0.1.0.dar
- ../../../../cap-governance/Interfaces/action/.daml/dist/cap-governance-action-v1-0.1.0.dar
- ../../../../cap-governance/util/.daml/dist/cap-governance-util-0.1.0.dar
- ../impl/.daml/dist/cap-version-0.1.0.dar
build-options:
  - --target=2.1
