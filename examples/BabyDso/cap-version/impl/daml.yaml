# Baby-Splice (cap version): the submission example — Splice's three decision
# machines (VoteRequest, Confirmation, AmuletPriceVote) implemented on the cap
# standard.
#
# Templates only: tests live in a sibling Test package, so this package carries
# no daml-script dependency.
sdk-version: 3.4.11
name: cap-version
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../../../lib/splice-api-token-metadata-v1-1.0.0.dar
- ../../../../lib/splice-util-0.1.7.dar
- ../../../../cap-core/util/time/.daml/dist/cap-core-time-v1-0.1.0.dar
- ../../../../cap-core/util/checked-fetch/.daml/dist/cap-core-checked-fetch-v1-0.1.0.dar
- ../../../../cap-core/Interfaces/submittable/.daml/dist/cap-core-submittable-v1-0.1.0.dar
- ../../../../cap-core/Interfaces/mechanism/.daml/dist/cap-core-mechanism-v1-0.1.0.dar
- ../../../../cap-governance/Interfaces/target/.daml/dist/cap-governance-target-v1-0.1.0.dar
- ../../../../cap-core/Interfaces/outcome/.daml/dist/cap-core-outcome-v1-0.1.0.dar
- ../../../../cap-governance/Interfaces/outcome/.daml/dist/cap-governance-outcome-v1-0.1.0.dar
- ../../../../cap-core/util/patchable/.daml/dist/cap-core-patchable-0.1.0.dar
- ../../../../cap-core/util/policies/.daml/dist/cap-core-policies-0.1.0.dar
- ../../../../cap-governance/Interfaces/ballot/.daml/dist/cap-governance-ballot-v1-0.1.0.dar
- ../../../../cap-governance/Interfaces/governor/.daml/dist/cap-governance-governor-v1-0.1.0.dar
- ../../../../cap-governance/util/.daml/dist/cap-governance-util-0.1.0.dar
build-options:
  - --target=2.1
