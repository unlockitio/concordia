# Templates used only by the demos. They live outside the test package because
# a package that defines templates and depends on daml-script drags daml-script
# onto any ledger the DAR is uploaded to.
sdk-version: 3.4.11
name: cap-example-majority-vote-fixtures
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../../../lib/splice-api-token-metadata-v1-1.0.0.dar
- ../../../../cap-core/cap-core-utils/.daml/dist/cap-core-utils-0.1.0.dar
- ../../../../cap-core/Interfaces/submittable/.daml/dist/cap-core-submittable-v1-0.1.0.dar
- ../../../../cap-governance/Interfaces/binding/.daml/dist/cap-governance-binding-0.1.0.dar
- ../../../../cap-governance/Interfaces/ballot/.daml/dist/cap-governance-ballot-v1-0.1.0.dar
build-options:
  - --target=2.1
