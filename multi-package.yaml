# Concordia workspace. `dpm build --all` builds these in dependency order;
# inter-package `data-dependencies` (the .daml/dist/*.dar paths) resolve from
# this list. Only packages that currently build are listed: the auctions
# example and the tier-2 tests reference packages that do not exist yet and
# return with the tier-2 rework.
packages:
# --- tier 1: cap-core ---
# Shared value types come from the Token Standard's official metadata DAR,
# vendored as a prebuilt binary at lib/ (not built here). All packages
# data-depend on it directly.
# Interfaces/ holds the frozen interfaces; util/ the public toolkit
# (checked-fetch, time, patchable, policies); internal/ the library-only checks.
- ./cap-core/util/time
- ./cap-core/util/checked-fetch
- ./cap-core/Interfaces/mechanism
- ./cap-core/Interfaces/submittable
- ./cap-core/internal/checks
- ./cap-core/Interfaces/outcome
- ./cap-core/util/patchable
- ./cap-core/util/policies
# --- tier 2: cap-governance ---
# target and outcome before governor: GovernanceOutcome requires cap-core's
# Outcome and binds Targets; Governor issues GovernanceOutcomes.
# ballot before governor: Governor is resolved with Ballots (Governor -> Ballot).
- ./cap-governance/Interfaces/target
- ./cap-governance/Interfaces/outcome
- ./cap-governance/Interfaces/ballot
- ./cap-governance/Interfaces/governor
- ./cap-governance/util
# --- tier 2: cap-auctions ---
- ./cap-auctions/Interfaces/types
- ./cap-auctions/Interfaces/bid
- ./cap-auctions/Interfaces/outcome
- ./cap-auctions/Interfaces/auction
# --- examples ---
# Baby-DSO (each variant with its own -Test package so no template package
# carries a daml-script dep):
#   original    the plain-Daml Splice reproduction — the governance reference,
#               no cap dependency; the behavioural baseline the cap-version
#               demos are checked against.
#   cap-version the submission example: Splice's three approval mechanisms
#               (VoteRequest, Confirmation, AmuletPriceVote) on the cap
#               standard.
- ./examples/BabyDso/original/Impl
- ./examples/BabyDso/original/Test
- ./examples/BabyDso/cap-version/impl
- ./examples/BabyDso/cap-version/Test
