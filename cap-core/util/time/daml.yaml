# Tier 1 — `Cap.Core.TimeV1`: the `isOpen` temporal predicate and the
# `checkWindow`/`checkFloor` window checks — the single home for the library's
# half-open window convention (inclusive floor, exclusive ceiling). Shared by
# the mechanism submission/resolution doors (`cap-core-checks`) and the domain
# execute doors' window guards (`cap-governance-outcome`).
sdk-version: 3.4.11
name: cap-core-time-v1
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../../lib/splice-util-0.1.7.dar
build-options:
  - --target=2.1
