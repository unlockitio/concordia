# Tier 1 (optional) — reusable helpers for implementations across every
# domain. Two modules, deliberately NOT bundled with the checks
# (cap-core-checks is fixed-body machinery the interfaces consume; nothing
# here is ever called by a fixed body):
#   Cap.Core.Patchable       three-way merge for standing state that several
#                            approved outcomes may update concurrently
#                            (ported from Splice's Splice.Util)
#   Cap.Core.TargetPolicies  named drift policies for the outcome interfaces'
#                            onTargetDrift hooks — strict and reconciling
#                            profiles
# Sits BELOW nothing it implements: it depends on the tier-1 interface
# packages and is imported only by implementations, so the interfaces never
# reference it (no cycle).
sdk-version: 3.4.11
name: cap-core-util
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../Interfaces/metadata/.daml/dist/cap-core-metadata-v1-0.1.0.dar
- ../Interfaces/submittable/.daml/dist/cap-core-submittable-v1-0.1.0.dar
- ../Interfaces/resolvable/.daml/dist/cap-core-resolvable-v1-0.1.0.dar
- ../Interfaces/checks/.daml/dist/cap-core-checks-v1-0.1.0.dar
- ../Interfaces/target/.daml/dist/cap-core-target-v1-0.1.0.dar
build-options:
  - --target=2.1
