# Public util — `Cap.Core.Policies`: named timing profiles for the `Mechanism`
# hooks (submittableAllowed / resolutionAllowed / withdrawAllowed), shared by
# every domain and wired into an `interface instance`. Imported only by
# implementations; no fixed body calls it.
sdk-version: 3.4.11
name: cap-core-policies
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../../lib/splice-api-token-metadata-v1-1.0.0.dar
- ../../../lib/splice-util-0.1.7.dar
- ../../Interfaces/mechanism/.daml/dist/cap-core-mechanism-v1-0.1.0.dar
build-options:
  - --target=2.1
