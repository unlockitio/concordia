# Tier 1 — the `Submittable` primitive: the single live artifact a slot holds
# while a mechanism runs, in one of three states (empty, full, withdrawn).
# Domain submittables `requires` this.
sdk-version: 3.4.11
name: cap-core-submittable-v1
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../../lib/splice-api-token-metadata-v1-1.0.0.dar
- ../../../lib/splice-util-0.1.7.dar
- ../../util/checked-fetch/.daml/dist/cap-core-checked-fetch-v1-0.1.0.dar
- ../mechanism/.daml/dist/cap-core-mechanism-v1-0.1.0.dar
build-options:
  - --target=2.1
