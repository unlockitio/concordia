# Tier 1 — `Cap.Core.ChecksV1`: the fixed checks that tier-2 *interface* fixed
# bodies call — the completeness gate, the window floors, the
# authority-signature check, and the state-machine transition floor. Also
# home to the checked-fetch machinery (`HasCheckedFetch`, `ForAuthority`,
# `ForResolvable`, `fetchChecked`/`fetchCheckedInterface`) and the `require`
# idiom: these sit here, upstream of every fixed body that consumes them, and
# implementations import this module directly for them. Depends on the
# interface faces the checks read (metadata, submittable, resolvable). See
# docs/cap-core-architecture.md.
sdk-version: 3.4.11
name: cap-core-checks-v1
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../metadata/.daml/dist/cap-core-metadata-v1-0.1.0.dar
- ../submittable/.daml/dist/cap-core-submittable-v1-0.1.0.dar
- ../resolvable/.daml/dist/cap-core-resolvable-v1-0.1.0.dar
build-options:
  - --target=2.1
