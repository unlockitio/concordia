# Tier 1 — `Cap.Core.ChecksV1`: the fixed checks tier-2 *interface* fixed
# bodies call — the completeness gate, the window floors, and the
# authority-signature check. Builds on the checked-fetch vocabulary
# (`cap-core-checked-fetch-v1`) and depends on the interface faces the checks
# read (metadata, submittable, resolvable). See docs/cap-core-architecture.md.
sdk-version: 3.4.11
name: cap-core-checks-v1
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../metadata/.daml/dist/cap-core-metadata-v1-0.1.0.dar
- ../time/.daml/dist/cap-core-time-v1-0.1.0.dar
- ../checked-fetch/.daml/dist/cap-core-checked-fetch-v1-0.1.0.dar
- ../submittable/.daml/dist/cap-core-submittable-v1-0.1.0.dar
- ../resolvable/.daml/dist/cap-core-resolvable-v1-0.1.0.dar
build-options:
  - --target=2.1
