# Tier 1 — the `Outcome` primitive: an outcome carrying pre-committed
# authority, its execution window, and the anyone-callable expiry. Domain-
# neutral: each domain layers its own execute door on this via `requires`
# (governance's target-bound door, auctions' settle/fail pair).
sdk-version: 3.4.11
name: cap-core-outcome-v1
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../../../lib/splice-api-token-metadata-v1-1.0.0.dar
- ../../../lib/splice-util-0.1.7.dar
- ../../util/checked-fetch/.daml/dist/cap-core-checked-fetch-v1-0.1.0.dar
- ../../util/time/.daml/dist/cap-core-time-v1-0.1.0.dar
- ../mechanism/.daml/dist/cap-core-mechanism-v1-0.1.0.dar
build-options:
  - --target=2.1
