# Tier 1 — the `Outcome` primitive: an outcome carrying pre-committed
# authority and its approved target bindings, whose guarded `Execute` enacts it
# once inside its window. Governance's approved actions and auctions' settlement
# obligations both `requires` this.
sdk-version: 3.4.11
name: cap-core-outcome-v1
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../metadata/.daml/dist/cap-core-metadata-v1-0.1.0.dar
- ../checks/.daml/dist/cap-core-checks-v1-0.1.0.dar
- ../target/.daml/dist/cap-core-target-v1-0.1.0.dar
build-options:
  - --target=2.1
