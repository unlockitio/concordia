# Tier 1 — `Cap.Core.TimeV1`: the `isOpen` temporal predicate — the single home
# for the library's half-open window convention (inclusive floor, exclusive
# ceiling). Shared by the outcome execution window (`cap-core-outcome`) and the
# resolvable submission/resolution checks (`cap-core-checks`).
sdk-version: 3.4.11
name: cap-core-time-v1
version: 0.1.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
build-options:
  - --target=2.1
